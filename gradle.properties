org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

android.useAndroidX=true
android.nonTransitiveRClass=true


kotlin.code.style=official

# ── 发布元数据（Maven Central；无敏感信息，入库共享）──────────────────
# 敏感凭据（Portal Token / GPG 口令）**不放这里**，放 ~/.gradle/gradle.properties
GROUP=io.github.fellow99
VERSION_NAME=0.2.0
POM_NAME=aosp-node-bridge
POM_DESCRIPTION=Embed a real Node.js runtime in the Android app process (NAPI bootstrap + dlopen + node::Start); host bridge Node<->Kotlin
POM_URL=https://github.com/fellow99/aosp-node-bridge
POM_SCM_CONNECTION=scm:git:git://github.com/fellow99/aosp-node-bridge.git
POM_SCM_DEVELOPMENT_CONNECTION=scm:git:git://github.com/fellow99/aosp-node-bridge.git
POM_LICENCE_NAME=MIT License
POM_LICENCE_URL=https://opensource.org/licenses/MIT
POM_LICENCE_FILE=${rootDir}/LICENSE
POM_DEVELOPER_ID=fellow99
POM_DEVELOPER_NAME=fellow99

# 发布开关：本机/CI 发布时命令行 -DRELEASE=true 或用户级 gradle.properties 覆盖
RELEASE=false
